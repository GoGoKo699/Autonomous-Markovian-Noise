name: Hosted mathematics

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  github-math:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_REPOSITORY: ${{ github.repository }}
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the exact proposed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated rendering dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/render-deps"
          cp verification/rendering/package.json verification/rendering/package-lock.json "$RUNNER_TEMP/render-deps/"
          npm ci --prefix "$RUNNER_TEMP/render-deps" --ignore-scripts --no-audit --no-fund
          "$RUNNER_TEMP/render-deps/node_modules/.bin/playwright" install chromium
      - name: Compare the actual GitHub rendering with the source
        run: |
          NODE_PATH="$RUNNER_TEMP/render-deps/node_modules" node verification/rendering/capture_hosted_math.cjs \
            --root "$GITHUB_WORKSPACE" \
            --repository "$SOURCE_REPOSITORY" \
            --revision "$SOURCE_REVISION" \
            --output "$RUNNER_TEMP/hosted-math" \
            --contract verification/rendering/math-contract.json
      - name: Retain the report and captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-math-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/hosted-math/
          if-no-files-found: warn
          retention-days: 7
